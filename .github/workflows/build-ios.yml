name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub

jobs:
  build-ios:
    name: Build iOS (.ipa)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: asset_mobile
        run: flutter pub get

      - name: Build iOS Application (Release Mode)
        working-directory: asset_mobile
        run: flutter build ios --release --no-codesign

      - name: Package .ipa Payload
        working-directory: asset_mobile
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Sahabat_Sakinah_Asset.ipa Payload
          rm -rf Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahabat_Sakinah_Asset-iOS
          path: asset_mobile/Sahabat_Sakinah_Asset.ipa
          retention-days: 14
